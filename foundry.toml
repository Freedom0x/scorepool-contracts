[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./"}]

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
